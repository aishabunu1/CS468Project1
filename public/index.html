<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed test</title>
<style>
  :root { --cobalt:#1e6b4b; --deep:#14503a; --ink:#fff; --mute:rgba(255,255,255,.8); --rule:rgba(255,255,255,.28); --signal:#ffc4d6; --on-signal:#0f3a28; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--cobalt); color:var(--ink);
         font:17px/1.5 "Bahnschrift", "DIN Alternate", "Roboto Condensed", system-ui, sans-serif; }
  main { max-width:1040px; margin:0 auto; padding:48px 24px 56px; }

  header { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:20px 32px; margin-bottom:32px; }
  h1 { margin:0; font-size:clamp(2.6rem, 8vw, 5rem); line-height:.95; font-weight:700; letter-spacing:-.02em; font-variation-settings:"wdth" 80; }
  .sub { margin:10px 0 0; color:var(--mute); max-width:34ch; }
  .controls { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  button { font:inherit; font-weight:700; font-size:1.1rem; background:var(--signal); color:var(--on-signal); border:0; border-radius:999px; padding:14px 34px; cursor:pointer; }
  button:hover:not(:disabled) { background:#fff; }
  button:disabled { background:rgba(255,255,255,.22); color:var(--ink); cursor:wait; }
  button:focus-visible { outline:3px solid #fff; outline-offset:3px; }
  #status { color:var(--mute); min-height:1.5em; }

  .trace { position:relative; background:var(--deep); border-radius:4px; height:240px; margin-bottom:32px; overflow:hidden; }
  .trace canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #trace-label { position:absolute; left:20px; top:16px; color:var(--mute); }
  #trace-label b { color:var(--ink); font-weight:700; }

  .stages { display:grid; grid-template-columns:repeat(3, 1fr); }
  .stage { position:relative; padding:20px 20px 4px; border-left:1px solid var(--rule); }
  .stage:first-child { border-left:0; padding-left:0; }
  .stage::before { content:""; position:absolute; left:0; right:0; top:0; height:4px; background:transparent; }
  .stage:first-child::before { left:0; }
  .stage.active::before { background:var(--signal); }
  .name { display:block; font-weight:700; font-size:1.15rem; }
  .value { display:block; margin:6px 0 4px; font-size:clamp(2.8rem, 7vw, 4.6rem); line-height:1; font-weight:700; font-variant-numeric:tabular-nums; font-variation-settings:"wdth" 85; }
  .value small { font-size:1.1rem; font-weight:400; color:var(--mute); margin-left:6px; font-variation-settings:"wdth" 100; }
  .detail { display:block; color:var(--mute); font-size:.95rem; min-height:3em; }
  #total { margin-top:28px; padding-top:16px; border-top:1px solid var(--rule); color:var(--mute); min-height:3.2em; }

  @media (max-width:700px) {
    main { padding:32px 16px 40px; }
    .trace { height:180px; }
    .stages { grid-template-columns:1fr; }
    .stage, .stage:first-child { border-left:0; border-top:1px solid var(--rule); padding:16px 0 12px; }
    .stage:first-child { border-top:0; }
    .stage::before { top:-1px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Speed test</h1>
      <p class="sub">Measures latency, download and upload between this browser and this server.</p>
    </div>
    <div class="controls">
      <button id="start">Start test</button><span id="status" role="status"></span>
    </div>
  </header>

  <div class="trace"><canvas id="trace" aria-hidden="true"></canvas><div id="trace-label">Live speed appears here once the test starts.</div></div>

  <div class="stages">
    <div class="stage" id="s-ping"><span class="name">Ping</span><span class="value" id="v-ping">–<small>ms</small></span><span class="detail" id="d-ping"></span></div>
    <div class="stage" id="s-down"><span class="name">Download</span><span class="value" id="v-down">–<small>Mbps</small></span><span class="detail" id="d-down"></span></div>
    <div class="stage" id="s-up"><span class="name">Upload</span><span class="value" id="v-up">–<small>Mbps</small></span><span class="detail" id="d-up"></span></div>
  </div>
  <div id="total"></div>
</main>

<script>
'use strict';
// parameters
const PING_COUNT   = 11;      // first sample is discarded (it includes TCP connection setup)
const STREAMS      = 4;       // parallel connections so that one TCP window does not cap the result
const WARMUP_MS    = 2000;    // initial burst period (excluded from the final result)
const MIN_MS       = 5000;    // do not stop before this (so the result is not just an initial burst)
const MAX_MS       = 10000;   // hard limit per phase
const STABLE_PCT   = 0.05;    // stop when two consecutive 1 second windows differ by less than 5%
const UPLOAD_BLOB  = 16 * 1024 * 1024;  // size of each upload request 
const RETRY_DELAY  = 200;     // ms to wait before retrying a failed request
const MAX_ERRORS   = 5;       // abort the phase after this many failed requests
const sleep = ms => new Promise(r => setTimeout(r, ms));

const $ = id => document.getElementById(id);
const MB = bytes => (bytes / 1e6).toFixed(2) + ' MB';

// convert from bytes to megabits per second 
const mbps = (bytes, ms) => (bytes * 8) / 1e6 / (ms / 1000);

// plots one value per sample for the running test: ping in ms, download andupload in Mbps.
const trace = (() => {
  const canvas = $('trace'), ctx = canvas.getContext('2d');
  let points = [];
  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const top = 64, bottom = h - 16, left = 20, right = w - 20;
    ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1;     
    for (let i = 0; i < 4; i++) { const y = top + (bottom - top) * i / 3; ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke(); }
    if (points.length < 2) return;
    const max = Math.max(...points) * 1.1 || 1;                       
    const x = i => left + (right - left) * i / Math.max(points.length - 1, 1);
    const y = v => bottom - (bottom - top) * (v / max);
    ctx.beginPath(); ctx.moveTo(x(0), bottom);
    points.forEach((v, i) => ctx.lineTo(x(i), y(v)));
    ctx.lineTo(x(points.length - 1), bottom); ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fill();
    ctx.beginPath(); points.forEach((v, i) => i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v)));
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke();
    const i = points.length - 1;                                      
    ctx.beginPath(); ctx.arc(x(i), y(points[i]), 6, 0, Math.PI * 2); ctx.fillStyle = '#ffc4d6'; ctx.fill();
  }
  window.addEventListener('resize', draw);
  return {
    reset(name, unit) { points = []; $('trace-label').innerHTML = '<b>' + name + '</b> in ' + unit; draw(); },
    push(v) { points.push(v); draw(); },
    note(text) { $('trace-label').textContent = text; }
  };
})();

// Ping
async function measurePing() {
  const rtts = [];
  performance.clearResourceTimings(); 
  for (let i = 0; i < PING_COUNT; i++) {
    const t0 = performance.now();
    const r = await fetch('/ping?r=' + Math.random(), { cache: 'no-store' });
    await r.arrayBuffer();
    rtts.push(performance.now() - t0);
    if (i > 0) { $('v-ping').firstChild.nodeValue = rtts[i].toFixed(0); trace.push(rtts[i]); }
  }
  rtts.shift();
  const sorted = [...rtts].sort((a, b) => a - b);
  const mid = sorted.length >> 1;
  const median = sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
  let jitter = 0;
  for (let i = 1; i < rtts.length; i++) jitter += Math.abs(rtts[i] - rtts[i - 1]);
  jitter /= rtts.length - 1;
  const entries = performance.getEntriesByType('resource').filter(e => e.name.includes('/ping'));
  const measured = entries.reduce((sum, e) => sum + e.transferSize, 0);
  const bytes = measured > 0 ? measured : PING_COUNT * 300;
  return { median, jitter, min: sorted[0], bytes };
}

// Generic throughput phase
// start() begins the transfers, getBytes() returns total bytes so far, stop() ends them.
// The phase ends as soon as the speed is stable, so little data is used on slow and fast links alike.
function runPhase({ start, getBytes, stop, onLive, getError }) {
  return new Promise((resolve, reject) => {
    const t0 = performance.now();
    const samples = [];
    const windowSpeed = (w, shift = 0) => {
      const end = samples[samples.length - 1].t - shift, begin = end - w;
      const a = samples.find(s => s.t >= begin), b = [...samples].reverse().find(s => s.t <= end);
      return a && b && b.t > a.t ? mbps(b.b - a.b, b.t - a.t) : 0;
    };
    start();
    const timer = setInterval(() => {
      const t = performance.now() - t0;
      samples.push({ t, b: getBytes() });
      onLive(windowSpeed(1000));
      const err = getError && getError();
      if (err) { clearInterval(timer); stop(); return reject(err); } 
      let done = t >= MAX_MS;
      if (!done && t >= MIN_MS) {
        const cur = windowSpeed(1000), prev = windowSpeed(1000, 1000);
        done = prev > 0 && Math.abs(cur - prev) / prev < STABLE_PCT;
      }
      if (done) {
        clearInterval(timer); stop();
        const first = samples.find(s => s.t >= WARMUP_MS) || samples[0];
        const last = samples[samples.length - 1];
        resolve({ speed: mbps(last.b - first.b, last.t - first.t), bytes: last.b, ms: last.t });
      }
    }, 100);
  });
}

// Download
function measureDownload() {
  let bytes = 0, stopped = false, errors = 0, failure = null;
  const controllers = [];
  async function stream() {
    while (!stopped) {                       
      const c = new AbortController(); controllers.push(c);
      try {
        const r = await fetch('/download?bytes=104857600&r=' + Math.random(), { signal: c.signal, cache: 'no-store' });
        const reader = r.body.getReader();
        for (;;) { const { done, value } = await reader.read(); if (done) break; bytes += value.length; }
      } catch (e) {
        if (stopped) break;                  
        if (++errors >= MAX_ERRORS) { failure = new Error('download kept failing'); break; }
        await sleep(RETRY_DELAY);            
      }
    }
  }
  return runPhase({
    start: () => { for (let i = 0; i < STREAMS; i++) stream(); },
    getBytes: () => bytes,
    getError: () => failure,
    stop: () => { stopped = true; controllers.forEach(c => c.abort()); },
    onLive: s => { trace.push(s); $('v-down').firstChild.nodeValue = s.toFixed(1); $('d-down').textContent = MB(bytes) + ' downloaded so far'; }
  });
}

// Upload
async function measureUpload() {
  const testId = Math.random().toString(36).slice(2); 
  const parts = [];
  for (let i = 0; i < UPLOAD_BLOB / 65536; i++) parts.push(crypto.getRandomValues(new Uint8Array(65536)));
  const blob = new Blob(parts);
  let bytes = 0, stopped = false, errors = 0, failure = null;
  const requests = [];
  function send() {
    return new Promise(resolve => {
      const x = new XMLHttpRequest(); requests.push(x);
      let last = 0;
      x.open('POST', '/upload?id=' + testId);
      x.upload.onprogress = e => { bytes += e.loaded - last; last = e.loaded; }; 
      x.onloadend = () => {
        if (!stopped && x.status !== 200) errors++;
        resolve();
      };
      x.send(blob);
    });
  }
  async function stream() {
    while (!stopped) {
      const before = errors;
      await send();
      if (errors > before) {
        if (errors >= MAX_ERRORS) { failure = new Error('upload kept failing'); break; }
        await sleep(RETRY_DELAY);
      }
    }
  }
  const result = await runPhase({
    start: () => { for (let i = 0; i < STREAMS; i++) stream(); },
    getBytes: () => bytes,
    getError: () => failure,
    stop: () => { stopped = true; requests.forEach(x => x.abort()); },
    onLive: s => { trace.push(s); $('v-up').firstChild.nodeValue = s.toFixed(1); $('d-up').textContent = MB(bytes) + ' uploaded so far'; }
  });
  // The browser's progress events count bytes it handed to the network, which can run ahead of reality.
  // So the final number comes from the server: it recorded when each byte actually arrived.
  try {
    const r = await fetch('/upload-stats?id=' + testId, { cache: 'no-store' });
    const stats = await r.json();
    const s = stats.samples;
    const first = s.find(p => p[0] >= WARMUP_MS) || s[0], last = s[s.length - 1];
    if (s.length > 1 && last[0] > first[0]) {
      return { speed: mbps(last[1] - first[1], last[0] - first[0]), bytes: stats.total, ms: result.ms, browserSpeed: result.speed };
    }
  } catch (e) {  }
  return { ...result, browserSpeed: result.speed };
}

// UI flow
const setActive = id => ['ping', 'down', 'up'].forEach(k => $('s-' + k).classList.toggle('active', k === id));

$('start').addEventListener('click', async () => {
  const btn = $('start'); btn.disabled = true;
  ['ping', 'down', 'up'].forEach(k => { $('v-' + k).firstChild.nodeValue = '–'; $('d-' + k).textContent = ''; });
  $('total').textContent = '';
  try {
    $('status').textContent = 'Measuring ping…'; setActive('ping'); trace.reset('Ping', 'ms');
    const p = await measurePing();
    $('v-ping').firstChild.nodeValue = p.median.toFixed(0);
    $('d-ping').textContent = `Jitter ${p.jitter.toFixed(1)} ms · best ${p.min.toFixed(0)} ms · ${PING_COUNT - 1} samples`;

    $('status').textContent = 'Measuring download…'; setActive('down'); trace.reset('Download', 'Mbps');
    const d = await measureDownload();
    $('v-down').firstChild.nodeValue = d.speed.toFixed(1);
    $('d-down').textContent = `${MB(d.bytes)} downloaded in ${(d.ms / 1000).toFixed(1)} s`;

    $('status').textContent = 'Measuring upload…'; setActive('up'); trace.reset('Upload', 'Mbps');
    const u = await measureUpload();
    $('v-up').firstChild.nodeValue = u.speed.toFixed(1);
    $('d-up').textContent = `${MB(u.bytes)} uploaded in ${(u.ms / 1000).toFixed(1)} s · measured by the server`;

    $('total').textContent = `Total data used: ${MB(d.bytes + u.bytes + p.bytes)} · total time: ${((d.ms + u.ms) / 1000).toFixed(1)} s (plus ping)`;
    $('status').textContent = 'Done'; trace.note('Test complete. Press Test again to repeat.');
  } catch (err) {
    $('status').textContent = 'Test failed: ' + err.message + '. Check the connection and try again.';
  }
  setActive(null); btn.disabled = false; btn.textContent = 'Test again';
});
</script>
</body>
</html>
